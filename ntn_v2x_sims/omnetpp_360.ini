[General]
#################################################################
# NETWORK TOPOLOGY & SATELLITE CONFIGURATION
#################################################################
# Defines the network topology for satellite-vehicle communication simulations
network = SatelliteAlertGrid



# Configure dynamic satellite creation to use custom multicast-enabled satellite type
# This ensures all dynamically created satellites support multicast routing
*.satelliteType = "mcast.McastSatellite"
*.satelliteInserter.satelliteModuleType = "mcast.McastSatellite"
#
# DUAL RADIO MEDIUM ARCHITECTURE FOR V2S AND S2V COMMUNICATION
#
# This configuration uses separate radio media to prevent unwanted V2V (vehicle-to-vehicle) 
# direct communication. The key insight is that vehicles and satellites do not share a 
# common radio medium:
#   - UPLINK MEDIUM: Vehicles transmit via node[0] (satNic0) -> Satellites receive via leo*[*] (satNic0)
#   - DOWNLINK MEDIUM: Satellites transmit via leo*[*] (satNic1) -> Vehicles receive via node[1..4] (satNic0)
#
# This design prevents node0's transmissions from being directly overheard by other vehicles 
# (node1-4), ensuring all vehicle-to-vehicle communication goes through the satellite constellation.
#
# IMPORTANT: The network NED file must define two radio medium submodules:
#   - uplinkRadioMedium (type: ApskScalarRadioMedium)
#   - downlinkRadioMedium (type: ApskScalarRadioMedium)
# These should be copies of the existing satelliteRadioMedium with appropriate configurations.


#################################################################
# BASIC SIMULATION SETTINGS
#################################################################
# Warmup period before statistics collection begins
warmup-period           = 5s
# Total simulation runtime (3 minutes)
sim-time-limit          = 180s
# Number of independent repetitions of this simulation
repeat                  = 1
# Run in express mode (faster, less detailed UI feedback)
cmdenv-express-mode     = true
# Flush output buffers immediately after each event
cmdenv-autoflush        = true
# Print status updates every 1 second
cmdenv-status-frequency = 1s
# Enable detailed debugging on error conditions
debug-on-errors         = true

#################################################################
# SATELLITE INSERTER & ORBITAL CONFIGURATION
#################################################################
# Fail simulation if TLE file contains unknown satellite IDs
*.satelliteInserter.ignoreUnknownSatellites = false
# Path to Two-Line Element (TLE) file for satellite orbital parameters
# Different satellite TLE files can be used for simualting for different heights and orbital configurations.
# Simulation start time synchronized with real UTC time for accurate orbital positions

*.satelliteInserter.pathToTleFile                   = "TLEs_13_01/360.txt"      # The live TLE file from stellitemaps.space
*.satelliteInserter.wall_clock_sim_start_time_utc   = "2026-01-13-08-15-40"     # To be varied bsed on the TLE file used.

#################################################################
# RADIO FREQUENCY & BANDWIDTH CONFIGURATION
#################################################################
# Center frequency for all satellite transceivers (both uplink and downlink)
*.**.satNic[*].radio.centerFrequency = 2GHz     # This is set from S-band simulations, can be varied depending on the study.
# Channel bandwidth for all interfaces
*.**.satNic[*].radio.bandwidth       = 10MHz    

#################################################################
# UPLINK BUDGET: Vehicle (node0) TX -> Satellite RX
#################################################################
# Vehicle transmit power 
*.node[0].satNic[0].radio.transmitter.power    = 2W         # To be varied bsed on the study.
# Vehicle antenna gain 
*.node[0].satNic[0].radio.antenna.gain = 0dB                # To be varied bsed on the study.
# Satellite receive antenna gain 
*.leo*[*].satNic[0].radio.antenna.gain = 33.8dB             # To be varied bsed on the study.
# Ambient noise power in uplink medium based on the Bandwidth noise formula.
*.uplinkRadioMedium.backgroundNoise.power = -105dBm         # To be varied bsed on the study.

# Satellite uplink receiver sensitivity thresholds
# Energy detection threshold (must exceed this to detect signal)
*.leo*[*].satNic[0].radio.receiver.energyDetection = -125dBm            # To be varied bsed on the study.
# Sensitivity threshold (signals below this are lost despite detection)
*.leo*[*].satNic[0].radio.receiver.sensitivity     = -120dBm            # To be varied bsed on the study.
# Signal-to-Noise+Interference Ratio (SNIR) required for successful reception
*.leo*[*].satNic[0].radio.receiver.snirThreshold   = 4dB                # To be varied bsed on the study.

#################################################################
# DOWNLINK BUDGET: Satellite TX -> Vehicle (node1-4) RX
#################################################################
# Satellite transmit power (higher power than vehicle for better coverage)
*.leo*[*].satNic[1].radio.transmitter.power = 20W      # To be varied bsed on the study.
# Vehicle receive antenna gain (omnidirectional)
*.node[1..4].satNic[0].radio.antenna.gain = 0dB        # To be varied bsed on the study.
# Satellite transmit antenna gain 
*.leo*[*].satNic[1].radio.antenna.gain = 33.8dB        # To be varied bsed on the study.
# Noise power in downlink medium based on the Bandwidth noise formula.
*.downlinkRadioMedium.backgroundNoise.power = -102dBm   # To be varied bsed on the study.

# Vehicle downlink receiver sensitivity thresholds
# Energy detection threshold for ground vehicles
*.node[1..4].satNic[0].radio.receiver.energyDetection = -115dBm         # To be varied bsed on the study.
# Sensitivity threshold for ground vehicles
*.node[1..4].satNic[0].radio.receiver.sensitivity     = -110dBm        # To be varied bsed on the study.
# SNIR threshold for successful downlink reception
*.node[1..4].satNic[0].radio.receiver.snirThreshold   = 4dB            # To be varied bsed on the study.


#################################################################
# MAC AND PHY BITRATE CONFIGURATION
#################################################################
# LEO satellite bitrate (higher capacity link)
*.leo*[*].satNic[*].mac.bitrate               = 100Mbps          # To be varied bsed on the study.
# Vehicle bitrate (lower capacity due to power constraints)
*.node[*].satNic[*].mac.bitrate               = 10Mbps           # To be varied bsed on the study.
# Satellite radio transmitter bitrate
*.leo*[*].satNic[*].radio.transmitter.bitrate = 100Mbps          # To be varied bsed on the study.
# Vehicle radio transmitter bitrate
*.node[*].satNic[*].radio.transmitter.bitrate = 10Mbps          # To be varied bsed on the study.

#################################################################
# APPLICATION LAYER PACKET CONFIGURATION
#################################################################
# Size of alert messages from sender (node0)
*.node[0].app[0].messageLength = 1000B                          # To be varied bsed on the study.
# Frequency of Alert Data Packet transmission 10Hz (10 messages per second)
*.node[0].app[0].sendInterval  = 0.1s                           # To be varied bsed on the study.

#################################################################
# OUTPUT STATISTICS & LOGGING
#################################################################
# File for detailed time-series vector statistics (SNR, packet loss, etc.)
# File for aggregated scalar statistics (averages, sums, counts etc.)

output-vector-file = "results/LEO/snr_final.vec"
output-scalar-file = "results/LEO/snr_final.sca"

# Disable or enable according to your preference.
**.scalar-recording = false
**.vector-recording = false

#################################################################
# UPLINK RADIO MEDIUM CONFIGURATION
#################################################################
# Medium type: Amplitude-Phase Shift Keying with scalar (power-based) radio
*.uplinkRadioMedium.typename = "ApskScalarRadioMedium"
# Disable satellite-to-satellite communication in uplink medium
*.uplinkRadioMedium.mediumLimitCache.disableS2SCommunication = true
# Minimum elevation angle for V2S communication (5 degrees above horizon)
*.uplinkRadioMedium.mediumLimitCache.minElevationAngleV2S = 5deg        # To be varied bsed on the study.     

# Path loss model: Free space (unobstructed line-of-sight) depends on the Distance and center frequency of the signal.
*.uplinkRadioMedium.pathLoss.typename = "FreeSpacePathLoss"         # It is calculated by the TLE files input and the SGP$Mobility module.
# Background noise model: Isotropic (uniform in all directions)
*.uplinkRadioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"

#################################################################
# DOWNLINK RADIO MEDIUM CONFIGURATION
#################################################################
# Medium type: Amplitude-Phase Shift Keying with scalar (power-based) radio
*.downlinkRadioMedium.typename = "ApskScalarRadioMedium"
# Disable satellite-to-satellite communication in downlink medium
*.downlinkRadioMedium.mediumLimitCache.disableS2SCommunication = true
# Minimum elevation angle for V2S communication (5 degrees above horizon)
*.downlinkRadioMedium.mediumLimitCache.minElevationAngleV2S = 5deg      # To be varied bsed on the study.

# Path loss model: Free space (unobstructed line-of-sight) depends on the Distance and center frequency of the signal.
*.downlinkRadioMedium.pathLoss.typename = "FreeSpacePathLoss"
# Background noise model: Isotropic (uniform in all directions)
*.downlinkRadioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"

#################################################################
# MULTICAST ROUTING CONFIGURATION
#################################################################
# Multicast routing uses (*,G) routes: 0.0.0.0/0 means "any source"
# These parameters configure how satellites forward multicast traffic

# Multicast group address
**.leo*[*].mcastGroupAddress   = "239.1.1.1"
**.leo*[*].mcastOriginAddress  = "0.0.0.0"
**.leo*[*].mcastOriginNetmask  = "0.0.0.0"
# Receive multicast on uplink interface (from ground vehicles)
**.leo*[*].mcastInInterface    = "satNic0"
# Forward multicast on downlink interface (to other vehicles)
**.leo*[*].mcastOutInterfaces  = "satNic1"



#################################################################
# SIMULATION ENVIRONMENT & COORDINATE SYSTEM
#################################################################
# Simulated for the Kronach-Coburg area in Germany, which is approximately 50 km x 50 km in size.
# Horizontal simulation area (X dimension): 50 km
*.playgroundSizeX = 50000m
# Horizontal simulation area (Y dimension): 50 km
*.playgroundSizeY = 50000m
# Vertical simulation area (Z dimension): 500 km (covers LEO orbital altitudes)
*.playgroundSizeZ = 500km
*.physicalEnvironment.ground.typename = "FlatGround"

#################################################################
# NETWORK LAYER CONFIGURATION (IPv4)
#################################################################
# Use automatic IPv4 address assignment and routing configuration
*.configurator.typename = "Ipv4NetworkConfigurator"
# Assign non-overlapping subnet addresses to different link types
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.addStaticRoutes = true
# Add default routes to enable inter-subnet communication
*.configurator.addDefaultRoutes = true

#################################################################
# SUMO VEHICLE SIMULATION (TraCI INTERFACE)
#################################################################
# SUMO launch configuration file defining vehicle routes and behaviors
*.manager.launchConfig   = xmldoc("kronach_coburg.launchd.xml")
# SUMO TraCI server hostname (localhost = embedded SUMO instance)
*.manager.host           = "localhost"
# SUMO TraCI server port number
*.manager.port           = 9999
# Module type for dynamically created vehicles (must support satellite communication)
*.manager.moduleType     = "space_veins.nodes.SatCar"
# Base name for vehicle modules (node[0], node[1], etc.)
*.manager.moduleName     = "node"
# Frequency of vehicle position updates from SUMO
*.manager.updateInterval = 0.1s
# Automatically terminate simulation when SUMO traffic ends
*.manager.autoShutdown   = true

#################################################################
# SOP (SUMO ORIGIN POINT) CONFIGURATION
#################################################################
# The SOP module provides coordinate transformation between SUMO and OMNeT++
# SUMO road network topology (used for coordinate reference)
*.sop.sumoNetXmlFile                   = xmldoc("kronach_2.net.xml")
# Don't use display string for mobility initialization
*.sop.mobility.updateFromDisplayString = false
*.sop.mobility.initFromDisplayString   = false
# Reference point coordinates (convoy leader starting position in SUMO coordinates)
*.sop.mobility.initialX = 13868.89m
*.sop.mobility.initialY = 4288.23m
# Ground level
*.sop.mobility.initialZ = 0m



#################################################################
# SATELLITE CONFIGURATION (DYNAMICALLY CREATED)
#################################################################
# Mobility model: SGP4 (Simplified General Perturbations) for orbital mechanics
*.leo*[*].mobility.typename = "SGP4Mobility"
*.leo*[*].mobility.updateInterval = 1s

# Enable IPv4 protocol stack on satellites
*.leo*[*].hasIpv4             = true
*.leo*[*].forwarding          = true
# Enable multicast forwarding (required for alert group forwarding)
*.leo*[*].multicastForwarding = true

# Application layer: simple UDP sink to observe alert arrivals
# Note: Actual packet forwarding is handled by the IP routing layer, not this app
*.leo*[*].numApps = 1
*.leo*[*].app[0].typename = "inet.applications.udpapp.UdpSink"
# Listen on port 4000 (same as vehicle apps)
*.leo*[*].app[0].localPort = 4000
# Accept broadcast or multicast packets
*.leo*[*].app[0].receiveBroadcast = true
# Start time for receiving 
*.leo*[*].app[0].startTime = 0s

# Network interfaces configuration
# No loopback interfaces (lo) on satellites
*.leo*[*].numLoInterfaces  = 0
# Two satellite communication interfaces: satNic0 (uplink) and satNic1 (downlink)
*.leo*[*].numSatelliteNics = 2

#################################################################
# GROUND VEHICLES (SATCAR)
#################################################################
# Mobility: Integrated with SUMO vehicle motion (Veins framework)
*.node[*].mobility.typename = "VeinsInetMobility"
# One satellite communication interface per vehicle
*.node[*].numSatelliteNics  = 1
# No loopback interface
*.node[*].numLoInterfaces   = 0
# No WiFi/WLAN interfaces (satellite-only communication)
*.node[*].numWlanInterfaces = 0
# Enable IPv4 protocol stack
*.node[*].hasIpv4           = true
# Disable SAMAC (Simplified Medium Access Control) protocol
*.node[*].useSamac          = false
# Vehicles do not forward packets (only send/receive for themselves)
*.node[*].forwarding        = false
# Vehicles do not participate in multicast forwarding
*.node[*].multicastForwarding = false

#################################################################
# SATELLITE INTERFACE STACK (APPLIES TO ALL NODES)
#################################################################
# Custom interface type optimized for satellite communication
*.**.satNic[*].typename = "SatelliteInterface"

# MAC (Medium Access Control) layer
# Acknowledge-capable MAC protocol (uses link-layer ACKs if enabled)
*.**.satNic[*].mac.typename     = "AckingMac"
# MAC header size (includes addressing and control fields)
*.**.satNic[*].mac.headerLength = 32B
# Full-duplex operation 
*.**.satNic[*].mac.fullDuplex   = true
# Disable link-layer acknowledgments 
*.**.satNic[*].mac.useAck       = false

# PHY (Physical) layer
# APSK (Amplitude-Phase Shift Keying) radio with power-based (scalar) signal representation
*.**.satNic[*].radio.typename               = "ApskScalarRadio"
# Use scalar radio representation (signal power in dBm) 
*.**.satNic[*].radio.signalAnalogRepresentation = "scalar"
# Reference antenna position for gain calculations (points to node's mobility module)
*.**.satNic[*].radio.antenna.mobilityModule = "^.^.^.mobility"

# Transmitter preamble: no synchronization overhead needed
*.**.satNic[*].radio.transmitter.preambleDuration = 0s
# PHY header size (contains synchronization and control fields)
*.**.satNic[*].radio.transmitter.headerLength     = 8B

#################################################################
# RADIO MEDIUM ASSIGNMENT PER INTERFACE
#################################################################
# This critical section ensures separation of uplink/downlink communications

# Node0 (sender): transmits to satellites on uplink medium
*.node[0].satNic[0].radio.radioMediumModule = "uplinkRadioMedium"

# Node1..4 (receivers): receive from satellites on downlink medium
*.node[1..4].satNic[0].radio.radioMediumModule = "downlinkRadioMedium"

# Satellites: dual interfaces for bidirectional communication
# satNic0: receives vehicle transmissions on uplink medium
*.leo*[*].satNic[0].radio.radioMediumModule = "uplinkRadioMedium"
# satNic1: transmits to vehicles on downlink medium
*.leo*[*].satNic[1].radio.radioMediumModule = "downlinkRadioMedium"

#################################################################
# ANTENNA CONFIGURATION FOR ALL INTERFACES
#################################################################
# Vehicle Antennas Module
*.node[*].satNic[0].radio.antenna.typename = "ConstantGainAntenna"
# Satellite Antenna Module (both Inetrfaces)
*.leo*[*].satNic[*].radio.antenna.typename = "ConstantGainAntenna"

#################################################################
# UPLINK TRANSMITTER & RECEIVER SPECIFICATIONS
#################################################################
# Vehicle transmit power on uplink (node0): set earlier in uplink budget section
# Other vehicles (node1..4) don't transmit on this interface
# Assign zero power to prevent runtime configuration prompts
*.node[1..4].satNic[0].radio.transmitter.power = 0W

# Satellite uplink receiver (satNic0): specs set earlier in uplink budget section
# Satellite satNic0 is not used for transmission (only reception from vehicles)
# Assign zero power to prevent runtime configuration prompts
*.leo*[*].satNic[0].radio.transmitter.power        = 0W


# Node0’s satNic0 is not used as a receiver in this scenario, but we still provide
# realistic receiver thresholds to avoid run‑time prompts (it won’t hear downlink
# transmissions because it uses the uplink medium).
*.node[0].satNic[0].radio.receiver.energyDetection = -105dBm
*.node[0].satNic[0].radio.receiver.sensitivity     = -100dBm
*.node[0].satNic[0].radio.receiver.snirThreshold   = 4dB

#################################################################
# satNic1 receiver params on satellites (often required by runtime)
#################################################################
# Configured to avoid runtime prompts.
*.leo*[*].satNic[1].radio.receiver.energyDetection = -125dBm
*.leo*[*].satNic[1].radio.receiver.sensitivity     = -120dBm
*.leo*[*].satNic[1].radio.receiver.snirThreshold   = 4dB


#################################################################
# APPLICATION LAYER - ALERT MESSAGE DISSEMINATION
#################################################################
# All vehicles run one application 
*.node[*].numApps = 1

#################################################################
# ALERT SENDER (NODE0)
#################################################################
# Application type: UDP-based alert broadcaster
*.node[0].app[0].typename      = "inet.applications.udpapp.UdpBasicApp"
# Multicast destination address (reserved experimental group)
*.node[0].app[0].destAddresses = "239.1.1.1"
# UDP destination port
*.node[0].app[0].destPort      = 4000
# UDP local port (source)
*.node[0].app[0].localPort     = 4000
# Name of packets generated (for logging and statistics)
*.node[0].app[0].packetName    = "Alert"

# Begin sending alerts at 7 seconds (after all nodes are formed and routing established)
*.node[0].app[0].startTime     = 7s
# Send alerts indefinitely (negative value means no stop time)
*.node[0].app[0].stopTime      = -1s
# Time-to-Live (TTL): limits packet hop count in network (64 = sufficient for LEO constellation)
*.node[0].app[0].timeToLive    = 64

#################################################################
# ALERT RECEIVERS (NODE1-4)
#################################################################
# Application type: UDP sink for receiving and logging alerts
*.node[1..4].app[0].typename = "inet.applications.udpapp.UdpSink"
# Listen on the same port as sender
*.node[1..4].app[0].localPort = 4000
# Accept broadcast and multicast packets
*.node[1..4].app[0].receiveBroadcast = true

# Multicast group configuration
# Join this multicast group (must match sender's destination)
*.node[1..4].app[0].multicastGroup = "239.1.1.1"
# Explicitly specify which interface to receive on (satNic0 only)
*.node[1..4].app[0].multicastInterface = "satNic0"
# Automatically join multicast groups specified above
*.node[1..4].app[0].joinLocalMulticastGroups = true
# Begin listening at 2 seconds (before sender starts)
*.node[1..4].app[0].startTime = 2s
# Listen indefinitely
*.node[1..4].app[0].stopTime  = -1s

############################################### END OF CONFIGURATION FILE ############################################