[General]
#################################################################
# 1) Network + satellite host type
#################################################################
# Use the same network topology as before
network = SatelliteAlertGrid



# Make sure satellites created dynamically use your McastSatellite type
*.satelliteType = "mcast.McastSatellite"
*.satelliteInserter.satelliteModuleType = "mcast.McastSatellite"
#
# Separate radio media for uplink (V2S) and downlink (S2V)
#
# The key idea behind option 3 is to avoid direct vehicle‑to‑vehicle (V2V)
# reception by ensuring that ground nodes and satellites do not share a
# single radio medium.  When the cars transmit, only the satellites
# hear them (uplink medium).  When the satellites transmit, only the
# cars hear them (downlink medium).  There is no medium common to both
# classes of nodes, so node0’s transmissions cannot be overheard by
# node1–4 directly.
#
# NOTE: The network NED must define these additional radio medium
# submodules (uplinkRadioMedium and downlinkRadioMedium).  In most
# cases you can copy the existing satelliteRadioMedium submodule in
# the .ned file and duplicate it under the new names.  Each of them
# should be of type ApskScalarRadioMedium.  Without adding the
# submodules in the NED, these assignments will be ignored.


#################################################################
# 3) Basic simulation settings
#################################################################
warmup-period           = 5s
sim-time-limit          = 180s
repeat                  = 1
cmdenv-express-mode     = true
cmdenv-autoflush        = true
cmdenv-status-frequency = 1s
debug-on-errors         = true

#################################################################
# 8) Satellite inserter
#################################################################
*.satelliteInserter.ignoreUnknownSatellites = false
*.satelliteInserter.pathToTleFile                   = "TLEs_13_01/360.txt"
*.satelliteInserter.wall_clock_sim_start_time_utc   = "2026-01-13-08-15-40"

#Values to be cahnged for results
# UPLINK & DOWNLINK
*.**.satNic[*].radio.centerFrequency = 2GHz
*.**.satNic[*].radio.bandwidth       = 10MHz

#UPLINK
*.node[0].satNic[0].radio.transmitter.power    = 2W  
*.node[0].satNic[0].radio.antenna.gain = 0dB 
*.leo*[*].satNic[0].radio.antenna.gain = 33.8dB 
*.uplinkRadioMedium.backgroundNoise.power = -105dBm

*.leo*[*].satNic[0].radio.receiver.energyDetection = -125dBm
*.leo*[*].satNic[0].radio.receiver.sensitivity     = -120dBm
*.leo*[*].satNic[0].radio.receiver.snirThreshold   = 4dB

#DOWNLINK
*.leo*[*].satNic[1].radio.transmitter.power = 20W
*.node[1..4].satNic[0].radio.antenna.gain = 0dB 
*.leo*[*].satNic[1].radio.antenna.gain = 33.8dB
*.downlinkRadioMedium.backgroundNoise.power = -102dBm

*.node[1..4].satNic[0].radio.receiver.energyDetection = -115dBm
*.node[1..4].satNic[0].radio.receiver.sensitivity     = -110dBm
*.node[1..4].satNic[0].radio.receiver.snirThreshold   = 4dB


# LEO sat Bitrate provided.
*.leo*[*].satNic[*].mac.bitrate               = 100Mbps
*.node[*].satNic[*].mac.bitrate               = 10Mbps
*.leo*[*].satNic[*].radio.transmitter.bitrate = 100Mbps
*.node[*].satNic[*].radio.transmitter.bitrate = 10Mbps

#Packet parameters
*.node[0].app[0].messageLength = 1000B
*.node[0].app[0].sendInterval  = 0.1s

#output files
output-vector-file = "results/LEO/snr_final.vec"
output-scalar-file = "results/LEO/snr_final.sca"
**.scalar-recording = false
**.vector-recording = false

# Define uplink radio medium (vehicles transmit here, satellites receive)
*.uplinkRadioMedium.typename = "ApskScalarRadioMedium"
*.uplinkRadioMedium.mediumLimitCache.disableS2SCommunication = true
*.uplinkRadioMedium.mediumLimitCache.minElevationAngleV2S = 5deg


*.uplinkRadioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.uplinkRadioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"
#*.uplinkRadioMedium.backgroundNoise.power = -75dBm

# Define downlink radio medium (satellites transmit here, cars receive)
*.downlinkRadioMedium.typename = "ApskScalarRadioMedium"
*.downlinkRadioMedium.mediumLimitCache.disableS2SCommunication = true
*.downlinkRadioMedium.mediumLimitCache.minElevationAngleV2S = 5deg
#*.downlinkRadioMedium.mediumLimitCache.centerFrequency = 2GHz

*.downlinkRadioMedium.pathLoss.typename = "FreeSpacePathLoss"
*.downlinkRadioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"
#*.downlinkRadioMedium.backgroundNoise.power = -72dBm

#################################################################
# 2) Multicast route installed by MulticastConfigurator
#    This is an (*,G) route: 0.0.0.0/0 means “any source”
#################################################################
**.leo*[*].mcastGroupAddress   = "239.1.1.1"
**.leo*[*].mcastOriginAddress  = "0.0.0.0"
**.leo*[*].mcastOriginNetmask  = "0.0.0.0"
**.leo*[*].mcastInInterface    = "satNic0"   # uplink receive
**.leo*[*].mcastOutInterfaces  = "satNic1"   # downlink forward



#################################################################
# 4) Environment
#################################################################
*.playgroundSizeX = 50000m
*.playgroundSizeY = 50000m
*.playgroundSizeZ = 500km
*.physicalEnvironment.ground.typename = "FlatGround"

#################################################################
# 5) IPv4 configurator
#################################################################
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.assignDisjunctSubnetAddresses = true
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true

#################################################################
# 6) TraCI / vehicles
#################################################################
*.manager.launchConfig   = xmldoc("kronach_coburg.launchd.xml")
*.manager.host           = "localhost"
*.manager.port           = 9999
*.manager.moduleType     = "space_veins.nodes.SatCar"
*.manager.moduleName     = "node"
*.manager.updateInterval = 0.1s
*.manager.autoShutdown   = true

#################################################################
# 7) SOP (sumo origin point for the convoy leader)
#################################################################
*.sop.sumoNetXmlFile                   = xmldoc("kronach_2.net.xml")
*.sop.mobility.updateFromDisplayString = false
*.sop.mobility.initFromDisplayString   = false
*.sop.mobility.initialX = 13868.89m
*.sop.mobility.initialY = 4288.23m
*.sop.mobility.initialZ = 0m



#################################################################
# 9) Satellites (dynamic)
#################################################################
*.leo*[*].mobility.typename = "SGP4Mobility"
*.leo*[*].mobility.updateInterval = 1s

*.leo*[*].hasIpv4             = true
*.leo*[*].forwarding          = true
*.leo*[*].multicastForwarding = true

# (Keep this sink only for observing arrivals; forwarding is handled by routing)
*.leo*[*].numApps = 1
*.leo*[*].app[0].typename = "inet.applications.udpapp.UdpSink"
*.leo*[*].app[0].localPort = 4000
*.leo*[*].app[0].receiveBroadcast = true
*.leo*[*].app[0].startTime = 0s

*.leo*[*].numLoInterfaces  = 0
*.leo*[*].numSatelliteNics = 2

#################################################################
# 10) Vehicles (SatCar)
#################################################################
*.node[*].mobility.typename = "VeinsInetMobility"
*.node[*].numSatelliteNics  = 1
*.node[*].numLoInterfaces   = 0
*.node[*].numWlanInterfaces = 0
*.node[*].hasIpv4           = true
*.node[*].useSamac          = false
*.node[*].forwarding        = false
*.node[*].multicastForwarding = false

#################################################################
# 11) NIC stack for satNic (cars + satellites)
#################################################################
*.**.satNic[*].typename = "SatelliteInterface"

*.**.satNic[*].mac.typename     = "AckingMac"
*.**.satNic[*].mac.headerLength = 32B
*.**.satNic[*].mac.fullDuplex   = true
*.**.satNic[*].mac.useAck       = false

# Use SNR‑capable radio
*.**.satNic[*].radio.typename               = "ApskScalarRadio"
*.**.satNic[*].radio.signalAnalogRepresentation = "scalar"
*.**.satNic[*].radio.antenna.mobilityModule = "^.^.^.mobility"

# Common PHY settings (avoid runtime prompts)
#*.**.satNic[*].radio.centerFrequency = 2GHz
#*.**.satNic[*].radio.bandwidth       = 4GHz
*.**.satNic[*].radio.transmitter.preambleDuration = 0s
*.**.satNic[*].radio.transmitter.headerLength     = 8B

#################################################################
# 12) Assign radio media per interface
#################################################################
# Node0 transmits only – its satNic0 uses the uplink medium
*.node[0].satNic[0].radio.radioMediumModule = "uplinkRadioMedium"

# Node1..4 receive only – their satNic0 uses the downlink medium
*.node[1..4].satNic[0].radio.radioMediumModule = "downlinkRadioMedium"

# Satellites use satNic0 for uplink reception and satNic1 for downlink
*.leo*[*].satNic[0].radio.radioMediumModule = "uplinkRadioMedium"
*.leo*[*].satNic[1].radio.radioMediumModule = "downlinkRadioMedium"

#################################################################
# 13) Medium: pathloss + noise (shared budgets)
#################################################################
# The uplink and downlink media already specify pathLoss and noise models.
# These lines are kept for clarity but not strictly necessary.
#*.satelliteRadioMedium.pathLoss.typename = "FreeSpacePathLoss"
#*.satelliteRadioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"
#*.satelliteRadioMedium.backgroundNoise.power = -120dBm

# Vehicle satNic0 antenna gain
*.node[*].satNic[0].radio.antenna.typename = "ConstantGainAntenna"
#*.node[*].satNic[0].radio.antenna.gain = 10dB
#*.node[1..4].satNic[0].radio.antenna.gain = 10dB
# Satellite satNic0/satNic1 antenna gain
*.leo*[*].satNic[*].radio.antenna.typename = "ConstantGainAntenna"
#*.leo*[*].satNic[0].radio.antenna.gain = 45dB
#*.leo*[*].satNic[1].radio.antenna.gain = 40dB

#################################################################
# 14) UPLINK budget (Vehicle TX -> Satellite RX)
#################################################################
# Uplink TX power: vehicle satNic0 (only node0 transmits)
#*.node[0].satNic[0].radio.transmitter.power    = 2W
# Assign a nominal power for other nodes to avoid run‑time ask (they never send)
*.node[1..4].satNic[0].radio.transmitter.power = 0W

# Satellite uplink receiver thresholds (satNic0)
#*.leo*[*].satNic[0].radio.receiver.energyDetection = -115dBm
#*.leo*[*].satNic[0].radio.receiver.sensitivity     = -110dBm
#*.leo*[*].satNic[0].radio.receiver.snirThreshold   = 6dB

# ALSO define satellite satNic0 transmitter power (unused but needed to prevent ask)
*.leo*[*].satNic[0].radio.transmitter.power        = 0W

#################################################################
# 15) DOWNLINK budget (Satellite TX -> Vehicles RX)
#################################################################
# Downlink TX power: satellite satNic1
#*.leo*[*].satNic[1].radio.transmitter.power = 20W

# Vehicle receivers (satNic0) – only node1..4 use their satNic0 for receiving
#*.node[1..4].satNic[0].radio.receiver.energyDetection = -105dBm
#*.node[1..4].satNic[0].radio.receiver.sensitivity     = -100dBm
#*.node[1..4].satNic[0].radio.receiver.snirThreshold   = 6dB

# Node0’s satNic0 is not used as a receiver in this scenario, but we still provide
# realistic receiver thresholds to avoid run‑time prompts (it won’t hear downlink
# transmissions because it uses the uplink medium).
*.node[0].satNic[0].radio.receiver.energyDetection = -105dBm
*.node[0].satNic[0].radio.receiver.sensitivity     = -100dBm
*.node[0].satNic[0].radio.receiver.snirThreshold   = 4dB

#################################################################
# 15b) satNic1 receiver params on satellites (often required by runtime)
#################################################################
# Even though satNic1 is only transmitting, some INET versions require receiver
# parameters on it to suppress interactive questions.
*.leo*[*].satNic[1].radio.receiver.energyDetection = -125dBm
*.leo*[*].satNic[1].radio.receiver.sensitivity     = -120dBm
*.leo*[*].satNic[1].radio.receiver.snirThreshold   = 4dB

#################################################################
# 16) Bitrates (optional)
#################################################################
#*.leo*[*].satNic[*].mac.bitrate               = 100Mbps
#*.node[*].satNic[*].mac.bitrate               = 10Mbps
#*.leo*[*].satNic[*].radio.transmitter.bitrate = 100Mbps
#*.node[*].satNic[*].radio.transmitter.bitrate = 10Mbps

#################################################################
# 17) Application layer — node0 sender, node1..4 receivers
#################################################################
*.node[*].numApps = 1

# Sender (only node0 transmits at APP layer)
*.node[0].app[0].typename      = "inet.applications.udpapp.UdpBasicApp"
*.node[0].app[0].destAddresses = "239.1.1.1"
*.node[0].app[0].destPort      = 4000
*.node[0].app[0].localPort     = 4000
*.node[0].app[0].packetName    = "Alert"

*.node[0].app[0].startTime     = 7s
*.node[0].app[0].stopTime      = -1s
*.node[0].app[0].timeToLive    = 64

# Receivers (only node1..4 receive at APP layer)
*.node[1..4].app[0].typename = "inet.applications.udpapp.UdpSink"
*.node[1..4].app[0].localPort = 4000
*.node[1..4].app[0].receiveBroadcast = true

# Join multicast group on the correct interface (satNic0)
*.node[1..4].app[0].multicastGroup = "239.1.1.1"
*.node[1..4].app[0].multicastInterface = "satNic0"
*.node[1..4].app[0].joinLocalMulticastGroups = true
*.node[1..4].app[0].startTime = 2s
*.node[1..4].app[0].stopTime  = -1s

#################################################################
# 18) Output files
#################################################################


